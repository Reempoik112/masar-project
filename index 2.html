<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="مسار: صانع التجارب السياحية بالذكاء الاصطناعي.">
<meta name="theme-color" content="#146C43">
<title>مسار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#146C43;--gold:#C9A23D;--navy:#0D3B66;--mist:#EEF4F1;--ink:#16212b;--mute:#5d6b76}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;color:var(--ink);background:#fff}
button,input{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:430px;height:100dvh;margin:0 auto;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:500px){body{background:var(--navy);padding:24px}.app{height:min(860px,calc(100dvh - 48px));border-radius:32px;box-shadow:0 30px 60px rgba(0,0,0,.45)}}
section{display:flex;flex-direction:column;flex:1;min-height:0}
/* login */
.lg{background:linear-gradient(165deg,#146C43,#0D3B66)}
.lgtop{position:relative;padding:calc(44px + env(safe-area-inset-top,0px)) 28px 30px;color:#fff;text-align:center}
.lgtop svg.rt{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.lgtop h1{position:relative;font-size:2rem;margin-top:8px}
.lgtop p{position:relative;color:#d5e1ec;font-size:.9rem}
.sheet{background:#fff;border-radius:28px 28px 0 0;padding:26px 24px 30px;flex:1;overflow-y:auto}
.sheet h2{font-size:1.15rem;color:var(--navy);margin-bottom:14px}
label{display:block;font-size:.85rem;font-weight:500;margin:12px 0 5px;color:var(--navy)}
input[type=text],input[type=password],input[type=date]{width:100%;padding:12px 14px;border:1.5px solid #cfdbd5;border-radius:14px;font-size:16px;background:#fff}
.err{color:#b3261e;font-size:.82rem;min-height:1.4em;margin-top:8px}
.go{width:100%;margin-top:12px;padding:13px;border-radius:14px;background:linear-gradient(135deg,var(--navy),#14568f);color:#fff;font-weight:700;box-shadow:0 6px 14px rgba(13,59,102,.25)}
.go:disabled{opacity:.55;box-shadow:none}
.gh{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:1.5px solid var(--g);color:var(--g);font-weight:700}
/* app */
.view{flex:1;overflow-y:auto;overscroll-behavior:contain}
.top{background:linear-gradient(160deg,#146C43,#0f5a37);color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px;border-radius:0 0 26px 26px}
.top small{display:block;color:#cfe8da;font-size:.8rem}
.top b{font-size:1.25rem}
.ai{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:999px;background:rgba(201,162,61,.22);color:#f3da8b;font-size:.75rem}
.top .tg{background:rgba(255,255,255,.18);color:#fff}
.pad{padding:4px 16px 20px}
h3{font-size:.92rem;margin:16px 0 8px;color:var(--navy)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dc{height:90px;border-radius:18px;color:#fff;padding:11px;text-align:start;display:flex;flex-direction:column;justify-content:space-between;font-weight:700;font-size:.92rem;line-height:1.35;border:3px solid transparent;position:relative}
.dc small{font-weight:400;font-size:.72rem;opacity:.92}
.dc[aria-pressed=true]{border-color:var(--gold);box-shadow:0 6px 14px rgba(13,59,102,.3)}
.dc[aria-pressed=true]::after{content:"✓";position:absolute;top:7px;inset-inline-end:9px;background:var(--gold);color:var(--navy);width:20px;height:20px;border-radius:50%;font-size:.75rem;display:grid;place-items:center}
.seg{display:flex;background:var(--mist);border-radius:13px;padding:3px}
.seg button{flex:1;padding:9px 2px;border-radius:10px;font-size:.84rem;color:var(--mute)}
.seg button[aria-pressed=true]{background:#fff;color:var(--g);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.step{display:flex;justify-content:space-between;align-items:center;margin-top:10px;background:var(--mist);border-radius:14px;padding:8px 14px;font-size:.88rem;font-weight:500}
.step div{display:flex;align-items:center;gap:14px}
.step button{width:36px;height:36px;border-radius:50%;background:var(--g);color:#fff;font-size:1.3rem;line-height:1}
.step button:disabled{background:#b9c8c0}
.step b{min-width:1.6em;text-align:center;font-size:1.15rem;color:var(--navy)}
.est,.sum{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--navy),#14568f);color:#fff;border-radius:16px;padding:13px 15px;margin:14px 0 4px;font-size:.86rem}
.est b,.sum b{color:#f3da8b;font-size:1.15rem}
.nt{font-size:.8rem;color:var(--g);margin:6px 4px 0;font-weight:500}.nt .w{color:#b3261e}
.tabs{display:flex;gap:2px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid #e3ebe7;background:#fff}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:16px;font-size:.74rem;color:var(--mute)}
.tabs span{font-size:1.25rem;line-height:1.3}
.tabs button[aria-selected=true]{background:var(--mist);color:var(--g);font-weight:700}
.empty{text-align:center;color:var(--mute);padding:80px 28px;font-size:.95rem}
.tg{display:inline-block;background:var(--mist);color:var(--g);border-radius:99px;padding:3px 12px;font-size:.74rem;margin-inline-end:5px;font-weight:700}
.day{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:4px 14px;font-size:.78rem;margin:16px 0 10px}
.tl{position:relative;padding-inline-start:28px}
.tl::before{content:"";position:absolute;inset-block:6px;inset-inline-start:10px;width:2px;background:repeating-linear-gradient(var(--gold) 0 4px,transparent 4px 8px)}
.it{position:relative;background:#fff;border:1px solid #e1ebe6;border-radius:14px;padding:10px 13px;margin-bottom:8px;font-size:.86rem;box-shadow:0 2px 6px rgba(13,59,102,.07)}
.it::before{content:attr(data-i);position:absolute;inset-inline-start:-28px;top:9px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--g);display:grid;place-items:center;font-size:.7rem}
.it time{display:block;color:var(--g);font-weight:700;font-size:.74rem}
.it em{display:block;font-style:normal;color:var(--navy);font-weight:700;font-size:.8rem;margin-top:2px}
.bk{display:flex;gap:12px;align-items:center;width:100%;text-align:start;padding:11px 12px;border:1px solid #e1ebe6;border-radius:14px;margin-bottom:8px;font-size:.86rem;background:#fff}
.bk.on{background:#eef7f2;border-color:#9fcfb5}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid #b7c7bf;display:grid;place-items:center;font-style:normal;color:#fff;font-size:.85rem;flex:none}
.bk.on .ck{background:var(--g);border-color:var(--g)}
.bk small{display:block;color:var(--mute);font-size:.76rem}
.bd{margin-inline-start:auto;font-style:normal;font-size:.72rem;font-weight:700;color:var(--g);background:#dff1e6;border-radius:99px;padding:2px 10px}
.row2{display:flex;gap:8px}.row2 .gh,.row2 .go{margin-top:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:12px 0}
.cal b{font-size:.76rem;color:var(--mute);font-weight:500}
.cal i{font-style:normal;padding:9px 0;border-radius:12px;font-size:.88rem}
.cal .tr{background:var(--g);color:#fff;font-weight:700}
.cal .td{box-shadow:inset 0 0 0 2px var(--gold)}
.mt{font-weight:700;color:var(--navy);text-align:center}
.card{background:var(--mist);border-radius:16px;padding:14px;margin-bottom:10px;font-size:.88rem}
.prof{display:flex;align-items:center;gap:14px}
.av{width:52px;height:52px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:1.4rem;font-weight:700}
.sr{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid #e8efeb;font-size:.92rem;width:100%;text-align:start}
.sw{width:40px;height:24px;border-radius:99px;background:#c9d4ce;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--g)}.sw.on::after{inset-inline-start:19px}
.toast{position:absolute;inset-inline:16px;bottom:88px;background:var(--g);color:#fff;border-radius:12px;padding:11px 14px;font-size:.88rem;text-align:center;transform:translateY(20px);opacity:0;transition:.25s;pointer-events:none}
.toast.show{transform:none;opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
<section id="login" class="lg">
<div class="lgtop">
<svg class="rt" viewBox="0 0 400 220" preserveAspectRatio="none" aria-hidden="true"><path d="M-10 200 C 90 120, 130 210, 210 120 S 330 40, 410 20" fill="none" stroke="#C9A23D" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"/></svg>
<svg width="64" height="64" viewBox="0 0 34 34" aria-hidden="true" style="position:relative"><circle cx="17" cy="17" r="16" fill="#fff"/><path d="M17 7a5.5 5.5 0 0 0-5.5 5.5C11.5 17 17 23 17 23s5.500-6 5.500-10.500A5.500 5.500 0 0 0 17 7z" fill="#C9A23D"/><circle cx="17" cy="12.500" r="2" fill="#146C43"/></svg>
<h1>مسار</h1>
<p>صانع التجارب السياحية بالذكاء الاصطناعي</p>
</div>
<div class="sheet">
<h2>تسجيل الدخول</h2>
<form id="lf" novalidate>
<label for="em">البريد الإلكتروني أو رقم الجوال</label>
<input type="text" id="em" autocomplete="username" inputmode="email">
<label for="pw">كلمة المرور</label>
<input type="password" id="pw" autocomplete="current-password">
<p class="err" id="err" role="alert"></p>
<button class="go" type="submit">تسجيل الدخول</button>
<button class="gh" type="button" id="guest">الدخول كزائرة</button>
</form>
</div>
</section>
<section id="main" hidden>
<div class="view" id="v"></div>
<nav class="tabs" role="tablist">
<button role="tab" data-tab="home"><span>🏠</span>الرئيسية</button>
<button role="tab" data-tab="trip"><span>🧳</span>رحلتي</button>
<button role="tab" data-tab="cal"><span>📅</span>التقويم</button>
<button role="tab" data-tab="set"><span>⚙️</span>الإعدادات</button>
</nav>
<div class="toast" id="toast" role="status"></div>
</section>
</main>
<script>
const DEST={
'العلا':[['اليوم الأول',[['٩:٠٠ ص','جولة في الحِجر (مدائن صالح)',95],['١:٠٠ م','غداء في وادي الفن',120],['٧:٠٠ م','إقامة في منتجع صحراوي',900]]],['اليوم الثاني',[['٦:٠٠ ص','رحلة منطاد فوق الصخور',1500],['٤:٣٠ م','غروب الشمس في مرايا',180],['٨:٠٠ م','عشاء تحت النجوم',260]]]],
'الدرعية':[['اليوم الأول',[['١٠:٠٠ ص','زيارة حي الطريف',70],['١:٣٠ م','غداء في حي البجيري',150],['٨:٠٠ م','إقامة في فندق تراثي',800]]],['اليوم الثاني',[['١٠:٠٠ ص','جولة في وادي حنيفة',90],['٤:٠٠ م','متحف ومعرض فني',60],['٨:٣٠ م','عرض ثقافي مسائي',200]]]],
'جدة التاريخية':[['اليوم الأول',[['٤:٠٠ م','جولة مشي في البلد',40],['٧:٣٠ م','عشاء على الكورنيش',170],['١٠:٠٠ م','إقامة في فندق إطلالة بحرية',700]]],['اليوم الثاني',[['٩:٠٠ ص','رحلة غوص وسنوركلينج',350],['٢:٠٠ م','غداء مأكولات بحرية',140],['٨:٠٠ م','فعالية فنية في الواجهة',120]]]],
'أبها':[['اليوم الأول',[['٩:٠٠ ص','التلفريك والسودة',130],['١:٠٠ م','غداء جبلي',100],['٧:٠٠ م','إقامة في نُزل بين الغيوم',650]]],['اليوم الثاني',[['١٠:٠٠ ص','قرية رجال ألمع',60],['٣:٠٠ م','مسار المشي في الجبال',80],['٨:٠٠ م','عشاء وقهوة سعودية',180]]]]
};
const META={'العلا':['🏜','صخور وتراث','#C9A23D,#8a5a2b'],'الدرعية':['🏰','تاريخ وثقافة','#146C43,#0b3d27'],'جدة التاريخية':['🌊','بحر وبلد قديم','#0D3B66,#1f86b5'],'أبها':['⛰','جبال وغيوم','#3f8f68,#146C43']};
const KIND={'فردي':[1,1,1],'زوجي':[2,2,2],'عائلة':[4,3,10],'أصدقاء':[3,3,12]};
const $=id=>document.getElementById(id);
const S={user:false,name:'',email:'',tab:'home',sub:'sched',dest:'العلا',bud:5000,other:false,custom:'',kind:'زوجي',n:2,made:false,items:[],start:'2026-11-12',notif:true};
const N=x=>x.toLocaleString('ar-SA'),fmt=x=>N(Math.round(x))+' ر.س';
const pl=n=>n==1?'شخص':n==2?'شخصين':n<=10?N(n)+' أشخاص':N(n)+' شخصًا';
const mult=()=>S.bud>0?Math.max(.7,Math.min(1.8,S.bud/(base()*S.n))):1;
const price=p=>p*mult()*S.n;
const base=()=>DEST[S.dest].reduce((a,d)=>a+d[1].reduce((b,i)=>b+i[2],0),0);
const ic=n=>/إقامة|فندق|منتجع|نُزل/.test(n)?'🛏':/غداء|عشاء|قهوة/.test(n)?'🍽':'🧭';
const addD=(s,k)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+k);return d};
const key=d=>d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
const GR='ar-SA-u-ca-gregory';
function estHTML(){const b=S.bud,mn=base()*.7*S.n,mx=base()*1.8*S.n;
 const note=!(b>0)?'اكتبي ميزانيتك لتظهر التكلفة.':b<mn?`<span class="w">ميزانيتك أقل من الحد الأدنى التقديري (${fmt(mn)}). زيدي الميزانية أو قلّلي الأشخاص.</span>`:b>mx?`يتبقى من ميزانيتك ${fmt(b-mx)}.`:'ضمن ميزانيتك ✓';
 return `<div class="est"><span>التكلفة التقديرية لـ ${pl(S.n)}</span><b>${fmt(base()*mult()*S.n)}</b></div><p class="nt">${note}</p>`}
function seg(k,opts,cur){return '<div class="seg">'+opts.map(o=>`<button data-k="${k}" data-v="${o}" aria-pressed="${cur===o}">${o}</button>`).join('')+'</div>'}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2300)}
const V={
home(){
 const [,mn,mx]=KIND[S.kind];
 let h=`<div class="top"><small>أهلًا ${S.name}</small><b>وين وجهتك الجاية؟</b><br><span class="ai">✦ جدولك بالذكاء الاصطناعي</span></div><div class="pad"><h3>اختاري وجهتك</h3><div class="cards">`+Object.keys(DEST).map(d=>`<button class="dc" data-k="dest" data-v="${d}" aria-pressed="${S.dest===d}" style="background:linear-gradient(135deg,${META[d][2]})"><span style="font-size:1.5rem">${META[d][0]}</span><span>${d}<br><small>${META[d][1]}</small></span></button>`).join('')+`</div><h3>الميزانية الإجمالية (ر.س)</h3><div class="seg">${[3000,5000,10000].map(v=>`<button data-b="${v}" aria-pressed="${!S.other&&S.bud===v}">${N(v)}</button>`).join('')}<button data-b="other" aria-pressed="${S.other}">أخرى</button></div>${S.other?`<input type="text" id="bo" inputmode="numeric" placeholder="اكتبي الميزانية اللي تبينها" value="${S.custom}" aria-label="الميزانية" style="margin-top:10px">`:''}<h3>مع من تسافرين؟</h3>${seg('kind',Object.keys(KIND),S.kind)}`;
 if(mx>mn)h+=`<div class="step"><span>كم عدد الأشخاص؟</span><div><button data-st="-1" aria-label="إنقاص" ${S.n<=mn?'disabled':''}>−</button><b>${N(S.n)}</b><button data-st="1" aria-label="زيادة" ${S.n>=mx?'disabled':''}>+</button></div></div>`;
 return h+`<div id="est">${estHTML()}</div><button class="go" id="gen" data-act="gen" ${S.bud>0?'':'disabled'}>✦ أنشئي رحلتي</button></div>`;
},
trip(){
 if(!S.made)return `<div class="empty"><div style="font-size:2.6rem">🧳</div>ما عندك رحلة بعد.<br>ابدئي التخطيط من الرئيسية.<button class="go" data-act="home">ابدئي التخطيط</button></div>`;
 let h=`<div class="top"><small>رحلتك إلى</small><b>${S.dest}</b><br><span class="tg">${fmt(S.bud)}</span><span class="tg">${pl(S.n)}</span></div><div class="pad"><div class="seg" style="margin-top:14px"><button data-sub="sched" aria-pressed="${S.sub==='sched'}">الجدول</button><button data-sub="book" aria-pressed="${S.sub==='book'}">الحجوزات</button></div>`;
 if(S.sub==='sched'){
  DEST[S.dest].forEach((d,x)=>{h+=`<div class="day">${d[0]}: ${addD(S.start,x).toLocaleDateString(GR,{weekday:'long',day:'numeric',month:'long'})}</div><div class="tl">`+d[1].map(i=>`<div class="it" data-i="${ic(i[1])}"><time>${i[0]}</time>${i[1]}<em>${fmt(price(i[2]))}</em></div>`).join('')+'</div>'});
  return h+`<div class="est"><span>التكلفة التقديرية</span><b>${fmt(S.items.reduce((a,i)=>a+price(i.p),0))}</b></div><button class="go" data-sub="book">انتقلي للحجوزات</button></div>`;
 }
 const sel=S.items.filter(i=>i.sel),tot=sel.reduce((a,i)=>a+price(i.p),0),nb=sel.filter(i=>!i.booked).length,all=sel.length===S.items.length;
 h+=`<h3>اختاري الحجوزات اللي تبينها</h3>`+S.items.map((i,x)=>`<button class="bk ${i.sel?'on':''}" data-x="${x}" aria-pressed="${i.sel}"><i class="ck">${i.sel?'✓':''}</i><div>${i.n}<small>${fmt(price(i.p))}</small></div>${i.booked?'<em class="bd">محجوز</em>':''}</button>`).join('');
 return h+`<div class="sum"><span>الإجمالي (${N(sel.length)} من ${N(S.items.length)})</span><b>${fmt(tot)}</b></div><div class="row2"><button class="gh" data-act="all">${all?'إلغاء التحديد':'تحديد الكل'}</button><button class="go" data-act="book" ${nb?'':'disabled'}>${nb?'احجزي المحدد ('+N(nb)+')':'لا يوجد جديد للحجز'}</button></div></div>`;
},
cal(){
 const s=new Date(S.start+'T12:00:00'),y=s.getFullYear(),m=s.getMonth(),f=new Date(y,m,1).getDay(),dm=new Date(y,m+1,0).getDate();
 const tk=S.made?[0,1].map(k=>key(addD(S.start,k))):[],td=key(new Date());
 let c='';for(let i=0;i<f;i++)c+='<span></span>';
 for(let d=1;d<=dm;d++){const k=y*10000+(m+1)*100+d;c+=`<i class="${tk.includes(k)?'tr':''} ${k===td?'td':''}">${N(d)}</i>`}
 let h=`<div class="top"><small>جدول رحلاتك</small><b>التقويم</b></div><div class="pad"><label for="sd">تاريخ بداية الرحلة</label><input type="date" id="sd" value="${S.start}"><h3 class="mt">${s.toLocaleDateString(GR,{month:'long',year:'numeric'})}</h3><div class="cal">${['ح','ن','ث','ر','خ','ج','س'].map(x=>`<b>${x}</b>`).join('')}${c}</div>`;
 if(!S.made)return h+`<div class="card">أنشئي رحلتك من الرئيسية وبتظهر أيامها في التقويم.</div></div>`;
 return h+DEST[S.dest].map((d,x)=>`<div class="card"><b>${d[0]}: ${addD(S.start,x).toLocaleDateString(GR,{weekday:'long',day:'numeric',month:'long'})}</b><br>${d[1].map(i=>i[1]).join('، ')}</div>`).join('')+'</div>';
},
set(){
 return `<div class="top"><small>حسابك</small><b>الإعدادات</b></div><div class="pad"><div class="card prof" style="margin-top:14px"><div class="av">${S.name.charAt(0)}</div><div><b>${S.name}</b><br><small style="color:var(--mute)">${S.email||'دخول كزائرة'}</small></div></div><button class="sr" data-act="notif"><span>التنبيهات</span><i class="sw ${S.notif?'on':''}"></i></button><div class="sr"><span>اللغة</span><span style="color:var(--mute)">العربية</span></div><div class="card" style="margin-top:16px"><b>عن مسار</b><br>منصة ذكية لتخطيط الرحلات وتجميع الحجوزات بنقرة واحدة حسب تفضيلاتك وميزانيتك ومرافقيك.<br><br><small style="color:var(--mute)">فريق المشروع: ريم العنزي (قائدة المجموعة)، حنين العسيري، لينا المقيرن، ايلاف الضاحي، شهيناز علي. الكلية التقنية الرقمية للبنات بالرياض، المجموعة ٢.</small></div><button class="gh" data-act="out">تسجيل الخروج</button></div>`;
}};
function render(){
 $('login').hidden=S.user;$('main').hidden=!S.user;
 if(!S.user)return;
 $('v').innerHTML=V[S.tab]();
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
}
function enter(name,email){S.user=true;S.name=name;S.email=email;S.tab='home';render()}
$('lf').addEventListener('submit',e=>{e.preventDefault();const em=$('em').value.trim(),pw=$('pw').value;
 if(!em||!pw){$('err').textContent='اكتبي البريد أو الجوال وكلمة المرور.';return}
 $('err').textContent='';enter(em.split('@')[0],em)});
$('guest').onclick=()=>enter('زائرة','');
document.addEventListener('click',e=>{
 const t=e.target.closest('.tabs button');if(t){S.tab=t.dataset.tab;render();$('v').scrollTop=0;return}
 const bb=e.target.closest('[data-b]');
 if(bb){const v=bb.dataset.b;if(v==='other'){S.other=true;S.bud=+S.custom||0}else{S.other=false;S.bud=+v}S.made=false;render();const bo=$('bo');if(bo)bo.focus();return}
 const k=e.target.closest('[data-k]');
 if(k){S[k.dataset.k]=k.dataset.v;if(k.dataset.k==='kind')S.n=KIND[S.kind][0];S.made=false;render();return}
 const st=e.target.closest('[data-st]');
 if(st){const [,mn,mx]=KIND[S.kind];S.n=Math.max(mn,Math.min(mx,S.n+ +st.dataset.st));S.made=false;render();return}
 const sb=e.target.closest('[data-sub]');if(sb){S.sub=sb.dataset.sub;render();$('v').scrollTop=0;return}
 const bk=e.target.closest('.bk');if(bk){const i=S.items[bk.dataset.x];if(!i.booked){i.sel=!i.sel;render()}return}
 const a=e.target.closest('[data-act]');if(!a)return;
 const act=a.dataset.act;
 if(act==='gen'){a.disabled=true;a.textContent='جاري بناء جدولك…';setTimeout(()=>{S.items=DEST[S.dest].flatMap(d=>d[1].map(i=>({n:i[1],p:i[2],sel:true,booked:false})));S.made=true;S.sub='sched';S.tab='trip';render();$('v').scrollTop=0;toast('تم إنشاء رحلتك إلى '+S.dest)},900)}
 else if(act==='home'){S.tab='home';render()}
 else if(act==='all'){const all=S.items.every(i=>i.sel);S.items.forEach(i=>{if(!i.booked)i.sel=!all});render()}
 else if(act==='book'){const b=S.items.filter(i=>i.sel&&!i.booked);b.forEach(i=>i.booked=true);render();toast('تم حجز '+N(b.length)+' بنقرة واحدة')}
 else if(act==='notif'){S.notif=!S.notif;render()}
 else if(act==='out'){S.user=false;S.made=false;S.items=[];$('pw').value='';render()}
});
document.addEventListener('input',e=>{if(e.target.id!=='bo')return;S.custom=e.target.value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');S.bud=+S.custom||0;S.made=false;$('est').innerHTML=estHTML();$('gen').disabled=!(S.bud>0)});
document.addEventListener('change',e=>{if(e.target.id==='sd'&&e.target.value){S.start=e.target.value;render()}});
</script>
</body>
</html>
